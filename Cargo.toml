[workspace]
members = ["crates/*"]
# The ci module under .dagger is its own Cargo project, which the engine builds alone.
exclude = [".dagger"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
authors = [
    "Ian Wilkinson <32589+iw@users.noreply.github.com>",
    "Codex <codex@openai.com>",
    "Claude <noreply@anthropic.com>",
]
repository = "https://github.com/tokeira/dagger-rust-sdk"
license = "Apache-2.0"

[workspace.dependencies]
dagger-codegen = { version = "=0.3.0", path = "crates/dagger-codegen" }
dagger-bootstrap = { version = "=0.3.0", path = "crates/dagger-bootstrap" }
tokeira-dagger-sdk = { version = "=0.3.0", path = "crates/dagger-sdk", default-features = false }
tokeira-dagger-sdk-macros = { version = "=0.3.0", path = "crates/dagger-sdk-macros" }
dagger-sdk-engine = { version = "=0.3.0", path = "crates/dagger-sdk-engine" }

serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
serde_graphql_input = { version = "0.1.1" }
tokio = { version = "1.35.1", features = ["full"] }
tracing = { version = "0.1.40", features = ["log"] }
tracing-subscriber = { version = "0.3.18", features = [
  "tracing-log",
  "tracing",
] }
thiserror = "1.0.56"
futures = "0.3.30"
base64 = "0.21.6"
dirs = "5.0.1"
flate2 = { version = "1.0.28", features = ["rust_backend"] }
hex = "0.4.3"
opentelemetry = { version = "=0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = ["trace"] }
reqwest = { version = "0.12.23", features = [
  "stream",
  "json",
  "rustls-tls",
], default-features = false }
rustix = { version = "1.1.4", features = ["fs"] }
sha2 = "0.10.8"
graphql-parser = "0.4.1"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
semver = "1.0.28"
tar = "0.4.40"
tempfile = "3.9.0"
toml_edit = { version = "=0.25.13", default-features = false, features = ["display", "parse"] }
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
async-trait = "0.1.77"
url = "2.5.8"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2"] }
convert_case = "0.6.0"
itertools = "0.12.0"

pretty_assertions = "1.4.0"
proptest = "1.11.0"
loom = "0.7.2"
trybuild = "1.0.120"
rand = "0.8.5"
clap = "4.4.14"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
