changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: |
  {{- $lines := .Body | splitn "\n" 2 -}}
  - {{ $lines._0 | trimSuffix "." }} by @{{.Custom.Author}} in https://github.com/tokeira/dagger-rust-sdk/pull/{{.Custom.PR}}
  {{- with $lines._1 -}}
    {{ " " }}\{{ "\n" }}
    {{- . | trim | indent 2 }}
  {{- end -}}
body:
  block: true
custom:
  - key: PR
    label: GitHub PR
    type: int
  - key: Author
    label: GitHub Author
    type: string
kinds:
  - label: Breaking
    format: '### 🔥 Breaking Changes'
  - label: Added
  - label: Changed
  - label: Deprecated
  - label: Removed
  - label: Fixed
  - label: Experimental
  - label: Security
  - label: Dependencies
headerFormat: |-
  This release targets stock Dagger `{{.Env.ENGINE_VERSION}}` engines and CLIs. Applications depend on `tokeira-dagger-sdk = "{{.Version}}"` from crates.io, which brings `tokeira-dagger-sdk-macros` at the same version, and modules install the runtime from `github.com/tokeira/dagger-rust-sdk/runtime@v{{.Version}}`.
footerFormat: |-
  {{- $contributorSet := dict }}
  {{- $maintainers := list "dependabot[bot]" "iw" }}
  {{- range $member := .Env.MAINTAINERS | default "[]" | fromJson }}
    {{- $member := lower $member }}
    {{- $maintainers = append $maintainers $member }}
  {{- end }}
  {{- range $change := .Changes }}
    {{- $authorList := splitList " " $change.Custom.Author }}
    {{- range $author := $authorList }}
      {{- if not (has (lower $author) $maintainers) }}
        {{- $contributorSet = set $contributorSet $author true }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if $contributorSet -}}
  ### Contributors
  Special thanks to our external contributors this release!
  {{- $contributors := keys $contributorSet | sortAlpha }}
  {{- range $k := $contributors }}
  - @{{ $k }}
  {{- end }}

  {{ end -}}

  ### What to do next
  - Read the [README](https://github.com/tokeira/dagger-rust-sdk#readme) and the [module authoring guide](https://github.com/tokeira/dagger-rust-sdk/blob/main/docs/module-authoring.md)
  - Report problems in [the repository's issues](https://github.com/tokeira/dagger-rust-sdk/issues)
newlines:
  beforeChangelogVersion: 1
  beforeKind: 1
  beforeFooterTemplate: 1
  beforeHeaderTemplate: 1
  endOfVersion: 1
envPrefix: CHANGIE_
