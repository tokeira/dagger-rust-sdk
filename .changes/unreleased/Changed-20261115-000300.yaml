kind: Changed
body: |
    Code generation accepts a later engine's copy of the target's API view. It compares the copy with the SDK's reviewed Core API by its wire contract: reworded documentation, new deprecations, and fields and optional arguments the SDK does not bind are accepted, while a removed or retyped coordinate, a changed default, a new required argument or input field, or a new enum value is refused. A module's operation manifest records the identity of the schema the SDK consumed rather than the bytes the engine sent, so the module's generated files stay current on such an engine. Moving a module generated by 0.6.0 to 0.7.0 takes one `dagger generate`, whose changes are committed with the move; until then the module fails to load with `GENERATED_STALE`, as after any SDK release. When a module's view is not the target, `dagger generate` tells the user of an engine older than the target to run the module on a newer one, and anyone else which `engineVersion` to declare.
