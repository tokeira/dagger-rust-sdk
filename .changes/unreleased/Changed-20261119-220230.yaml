kind: Changed
body: |
    `dagger generate` treats a module's generated files as Dagger's Go SDK treats the files it records, with the module's `.dagger/rust/operation-manifest.json` as the record. A deleted generated file is written again, where 0.8.0 refused with `previously owned artifact is missing or not regular`. An edited file that generation would rewrite is refused with `<path> contains user changes; refusing to overwrite it`, and nothing is written; 0.8.0 refused it with `previously owned artifact digest is stale`. An edited file that generation no longer writes, such as a binding of a removed dependency, is kept and no longer recorded, and generation carries on, where 0.8.0 refused with the same message. A file the manifest does not record is replaced when it begins with `// @generated`, and adopted when it already holds the generated bytes, where 0.8.0 refused either. An unchanged file that generation no longer writes is now removed from the workspace, where 0.8.0 left it there.
