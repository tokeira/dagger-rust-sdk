kind: Fixed
body: |
    Void-typed bindings decode correctly: a dedicated `execute_void` path (generated core and standalone clients alike) decodes the prescribed JSON null and refuses any other shape loudly, replacing the strict serde unit decode that failed against live engines. Thirteen call sites across six generated types were affected, `Container.exportImage` among them.

    The release verification consumer now exercises one Void-typed field against the completed engine — the wire encoding of a custom scalar is invisible in schema bytes, so engine/SDK agreement on it is provable only there.
time: 2026-08-18T00:00:00Z
