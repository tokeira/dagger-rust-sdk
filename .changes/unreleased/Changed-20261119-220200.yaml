kind: Changed
body: |
    A module's dependencies are exactly the clients recorded for it. `dagger generate` rewrites the `[[dependencies]]` tables of the module's `dagger-module.toml` from the clients in the workspace's `dagger.toml`, so a dependency written by hand that is not a client is removed, and the changes `dagger generate` shows before applying them include the removal. Before regenerating a 0.8.0 module with this release, run `dagger module client add <source>` once for each dependency its `dagger-module.toml` states, with the `source` the table states. A table that is then a client keeps its name and other settings, and loses its `pin`; `dagger.lock` holds the commit of a Git reference. A module configured by `dagger.json` alone regenerates as before while it has no dependencies and no clients; with either, generation fails before writing anything and advises `dagger module migrate` with the module's path from the workspace root, such as `dagger module migrate /.dagger/modules/gate`, which moves the configuration to `dagger-module.toml` and records its dependencies as clients, then `dagger generate`; a coding agent passes `-y` to apply each, or `--no-apply` to preview the migration. `dagger module client add` in such a module, which the engine takes for a Cargo package until the module is migrated, fails the same way before writing anything, and the advice ends with `dagger module client add` again, run from the directory that holds `dagger.json`. A new module's `dagger-module.toml` is written without indentation.
