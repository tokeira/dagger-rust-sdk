kind: Added
body: |
    A Cargo package that is not a module calls a Dagger module through a typed client. `dagger module client add <module>`, run in the package's directory, records the module in the workspace's `dagger.toml` and generates `src/dagger_clients/<module>/`; the author writes `mod dagger_clients;` once, and generation never edits authored source. `greeter::Client::new(&client)` takes the package's `dagger_sdk::Client` and sends nothing. It has the module's constructor, `greeter()` and `greeter_opts(&greeter::QueryGreeterOpts::default().with_greeting("hi"))`, with `r#ref` and `load` for the module's handles and Core's, in the calling convention of a module's dependencies. The session has the engine serve the module once, before the first request made through the client. A client generated for a function the module no longer has fails with `generated client for "<address>" is out of date; regenerate it`, a `QueryError::ModuleClient`, which is a new variant. Generation sets the package's dependency on `tokeira-dagger-sdk` to exactly the release, or the commit, the runtime is installed from, keeps the dependency's key and other fields, and leaves `Cargo.lock` alone; a dependency inherited from a Cargo workspace must already state that release. Each generated directory has a `.dagger-generated.json` that records its files: `dagger generate` refuses to overwrite a generated file that was edited, with `<path> contains user changes; refusing to overwrite it`, and writes nothing, and `dagger module client rm` removes a client's unchanged files. The generated code passes the package's own `cargo fmt --check` and `cargo clippy -- -D warnings`. The [module clients guide](https://github.com/tokeira/dagger-rust-sdk/blob/main/docs/client-generation.md) describes the calls, what generation writes, and what it refuses.
