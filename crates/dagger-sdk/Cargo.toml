[package]
name = "tokeira-dagger-sdk"
description = "Rust SDK for Dagger, maintained by Tokeira. Not affiliated with Dagger, Inc."
publish = true
readme = "README.md"
include = ["/src/**", "/examples/**", "!/examples/*/app/**", "/README.md", "/LICENSE", "/NOTICE"]

version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lib]
# Code names the SDK `dagger_sdk` whichever package name a project depends on.
name = "dagger_sdk"

[lints]
workspace = true

[dependencies]
tokeira-dagger-sdk-macros.workspace = true
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_graphql_input = { workspace = true }
semver.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

futures.workspace = true
base64.workspace = true
dirs.workspace = true
flate2.workspace = true
hex.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
reqwest.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
tracing-opentelemetry.workspace = true
async-trait.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
loom.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
rand.workspace = true
trybuild.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Reads the loopback transport's socket options back from the kernel.
rustix = { workspace = true, features = ["net"] }

[features]
default = ["gen"]
gen = []

[[example]]
name = "build-the-application"
path = "examples/build-the-application/main.rs"
required-features = ["gen"]

[[example]]
name = "caching"
path = "examples/caching/main.rs"
required-features = ["gen"]

[[example]]
name = "ci-checks"
path = "examples/ci-checks.rs"
required-features = ["gen"]

[[example]]
name = "existing-dockerfile"
path = "examples/existing-dockerfile/main.rs"
required-features = ["gen"]

[[example]]
name = "first-pipeline"
path = "examples/first-pipeline/main.rs"
required-features = ["gen"]

[[example]]
name = "injected-connection"
path = "examples/injected_connection.rs"
required-features = ["gen"]

[[example]]
name = "logging"
path = "examples/logging/main.rs"
required-features = ["gen"]

[[example]]
name = "multi-stage-build"
path = "examples/multi-stage-build/main.rs"
required-features = ["gen"]

[[example]]
name = "publish-the-application"
path = "examples/publish-the-application/main.rs"
required-features = ["gen"]

[[example]]
name = "test-the-application"
path = "examples/test-the-application/main.rs"
required-features = ["gen"]
