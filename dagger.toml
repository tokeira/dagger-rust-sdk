# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.rust-sdk]
source = "github.com/tokeira/dagger-rust-sdk/runtime@7cf1ac9a2626e819d4730ceeccd3ac62a8e061c8"

[sdks.rust]
module = "rust-sdk"

[modules.ci]
source = ".dagger/modules/ci"

[sdks.rust.scopes.".dagger/modules/ci"]
is-module = true
name = "ci"
