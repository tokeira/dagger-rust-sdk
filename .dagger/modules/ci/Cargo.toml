package = { name = "ci", version = "0.1.0", edition = "2024", rust-version = "1.99.1" }

[dependencies]
dagger-sdk = { package = "tokeira-dagger-sdk", git = "https://github.com/tokeira/dagger-rust-sdk", rev = "1748fad08e077952217ae060183082736fa3eb62" }
serde_json = "1.0.111"
tokio = { version = "1.35.1", default-features = false, features = ["macros", "rt", "net", "time"] }

[[bin]]
name = "dagger-module"
path = "src/bin/dagger-module.rs"
